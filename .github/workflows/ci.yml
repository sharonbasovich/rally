name: Rally checks
on: [push, pull_request]
jobs:
  browser_live:
    needs: test
    if: github.ref == 'refs/heads/browser-tracking' && github.event_name == 'push' && contains(github.event.head_commit.message, '[browser-live-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RALLY_LIVE_URL: https://rally-sharon-browser.azurewebsites.net
      RALLY_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/wait-for-deployment.mjs
      - run: npx playwright test --config playwright.browser-live.config.ts
  live:
    needs: test
    if: github.ref == 'refs/heads/cloud-play' && github.event_name == 'push' && contains(github.event.head_commit.message, '[live-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RALLY_LIVE_URL: https://rally-sharon.azurewebsites.net
      RALLY_TEST_CAMERA: '1'
      RALLY_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/wait-for-deployment.mjs
      - run: npx playwright test --config playwright.live.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-failure
          path: test-results/**/error-context.md
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
